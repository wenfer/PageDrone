<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>自动签到助手</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="header">
      <div class="brand">
        <img src="../icons/icon48.png" alt="" width="24" height="24" />
        <h1>自动签到助手</h1>
      </div>
      <div class="header-actions">
        <button id="btnSettings" class="btn ghost" title="打开设置">设置</button>
      </div>
    </header>

    <section class="status-bar" id="statusBar">
      <span class="dot" id="statusDot"></span>
      <span id="statusText">空闲</span>
    </section>

    <section class="actions">
      <button id="btnRunAll" class="btn primary">全部签到</button>
      <button id="btnStop" class="btn danger-outline" title="卡住或误关标签后点这里">强制停止</button>
      <button id="btnRefresh" class="btn">刷新</button>
    </section>

    <section id="welcome" class="welcome hidden">
      <p><strong>还没有配置站点</strong></p>
      <p>点击下方按钮打开设置页，添加要签到的网站。</p>
      <button id="btnOpenOptions" class="btn primary block">打开设置页</button>
      <ol class="help-steps">
        <li>工具栏点击本扩展图标可打开此弹窗</li>
        <li>在设置页「新建站点」填写签到 URL</li>
        <li>配置步骤或脚本后保存，再点「全部签到」</li>
      </ol>
    </section>

    <section class="sites">
      <div class="section-title">站点</div>
      <div id="siteList" class="site-list">
        <div class="empty">加载中…</div>
      </div>
    </section>

    <section class="logs">
      <div class="section-title">最近日志</div>
      <div id="logList" class="log-list">
        <div class="empty">暂无日志</div>
      </div>
    </section>

    <script type="module" src="popup.js"></script>
  </body>
</html>
